name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  workflow-node-code:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    env:
      # The conversion must not depend on the host timezone.
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run the workflow node-code tests
        run: node --test tests/*.test.js
